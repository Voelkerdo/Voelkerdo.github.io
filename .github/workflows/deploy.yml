# Deploys the portfolio to GitHub Pages, but only after the same checks as locally (REQ-14, D-25).
# Actions are pinned to commit SHAs; Dependabot proposes updates (AC-14.3, AC-14.5, TD-20).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests (e.g. from Dependabot) are checked, never deployed
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job alone may write to Pages (AC-14.3)
permissions:
  contents: read

# One deployment at a time; a running one is never cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Verify, security check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: assets
    steps:
      - name: Checkout with full history (Transport Log, Settings › System)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security check (npm audit, registry signatures)
        run: npm run security

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck, lint, unit, e2e, security tests)
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: assets/dist

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
