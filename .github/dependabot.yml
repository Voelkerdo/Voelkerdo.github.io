# Weekly update proposals for npm dependencies and the pinned GitHub Actions (AC-14.5)
version: 2
updates:
  - package-ecosystem: npm
    directory: /assets
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Must match the version UI5 uses for the self-hosted fonts (AC-13.1); updated with UI5
      - dependency-name: '@sap-theming/theming-base-content'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
